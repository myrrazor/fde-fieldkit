[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fieldkit-debrief"
version = "0.2.0"
readme = "README.md"
authors = [{ name = "FDE Fieldkit contributors" }]
license = "MIT"
license-files = ["LICENSE"]
description = "Turn field notes into reports"
requires-python = ">=3.12"
dependencies = [
    "fieldkit",
    # web.py declares its request body with a BaseModel; fastapi pulls pydantic
    # in anyway, but the direct import deserves a direct declaration
    "pydantic>=2",
]

[project.urls]
Homepage = "https://fde-tools.vercel.app"
Documentation = "https://fde-tools.vercel.app/docs/"
Repository = "https://github.com/myrrazor/fde-fieldkit"
Issues = "https://github.com/myrrazor/fde-fieldkit/issues"
Changelog = "https://github.com/myrrazor/fde-fieldkit/blob/main/CHANGELOG.md"

[project.entry-points."fieldkit.plugins"]
debrief = "fieldkit_debrief.cli:app"

[project.entry-points."fieldkit.web"]
debrief = "fieldkit_debrief.web"

[tool.uv.sources]
fieldkit = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/fieldkit_debrief"]
