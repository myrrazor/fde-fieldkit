[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fieldkit-awcp"
version = "0.2.0"
readme = "README.md"
authors = [{ name = "FDE Fieldkit contributors" }]
license = "MIT"
license-files = ["LICENSE"]
description = "Check AI workload specs, diff versions, and score golden eval suites locally"
requires-python = ">=3.12"
dependencies = [
    "fieldkit",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://fde-tools.vercel.app"
Documentation = "https://fde-tools.vercel.app/docs/"
Repository = "https://github.com/myrrazor/fde-fieldkit"
Issues = "https://github.com/myrrazor/fde-fieldkit/issues"
Changelog = "https://github.com/myrrazor/fde-fieldkit/blob/main/CHANGELOG.md"

[project.entry-points."fieldkit.plugins"]
awcp = "fieldkit_awcp.cli:app"

[project.entry-points."fieldkit.web"]
awcp = "fieldkit_awcp.web"

[tool.uv.sources]
fieldkit = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/fieldkit_awcp"]
