[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fieldkit-netwatch"
version = "0.2.0"
readme = "README.md"
authors = [{ name = "FDE Fieldkit contributors" }]
license = "MIT"
license-files = ["LICENSE"]
description = "Observe and control network access from AI coding agents"
requires-python = ">=3.12"
dependencies = ["fieldkit"]

[project.urls]
Homepage = "https://fde-tools.vercel.app"
Documentation = "https://fde-tools.vercel.app/docs/"
Repository = "https://github.com/myrrazor/fde-fieldkit"
Issues = "https://github.com/myrrazor/fde-fieldkit/issues"
Changelog = "https://github.com/myrrazor/fde-fieldkit/blob/main/CHANGELOG.md"

[project.entry-points."fieldkit.plugins"]
netwatch = "fieldkit_netwatch.cli:app"

[project.entry-points."fieldkit.web"]
netwatch = "fieldkit_netwatch.web"

[tool.uv.sources]
fieldkit = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/fieldkit_netwatch"]
