name: Build and publish PyPI distributions

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full reviewed main commit SHA to build
        required: true
        type: string
      publish:
        description: Upload to PyPI (requires separate release approval)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'myrrazor/fde-fieldkit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Require the reviewed commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.3"
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --locked --all-packages
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q
      - run: uv build --all-packages --build-constraint build-constraints.txt --out-dir pypi-dist
      - run: uv run --locked python scripts/check_release_artifacts.py pypi-dist
      - name: Check exact upload contents
        run: uv run --locked python scripts/check_pypi_release.py pypi-dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-distributions
          path: pypi-dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: inputs.publish && github.repository == 'myrrazor/fde-fieldkit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fde-fieldkit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: pypi-dist/
      - name: Publish validated distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@106e0b0b7c337fa67ed433972f777c6357f78598 # v1.13.0
        with:
          packages-dir: pypi-dist/
