name: ci

on:
  push:
  pull_request:
    branches: [testing]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.3"
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --locked --all-packages
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q
      - run: python site/check_site.py
      - name: Check browser JavaScript syntax
        run: find src plugins site -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: bash scripts/check-public-privacy.sh
      - run: uv build --all-packages
      - run: python scripts/check_release_artifacts.py dist

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks release
        shell: bash
        run: |
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all available Git history
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts="--all --full-history" --redact'
