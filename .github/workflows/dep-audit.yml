name: dep-audit

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch: {}
  pull_request:
    branches: [testing]
    paths:
      - "pyproject.toml"
      - "plugins/**/pyproject.toml"
      - "uv.lock"
      - ".github/workflows/dep-audit.yml"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.3"
          python-version: "3.12"
      - run: |
          uv export --locked --all-packages --all-extras --no-dev \
            --no-emit-workspace --no-hashes --no-annotate --no-header \
            --output-file requirements-audit.txt
      - run: uv tool run --from pip-audit==2.10.1 pip-audit --requirement requirements-audit.txt --no-deps --disable-pip
