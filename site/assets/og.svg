<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">FDE Tools</title>
  <desc id="desc">Seven Fieldkit tools and one control-plane prototype for forward-deployed engineering work.</desc>
